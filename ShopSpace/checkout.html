<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <header class="site-header">
            <nav class="navbar">
                <a href="index.html" class="logo">ShopSpace</a>
                <button class="nav-toggle">☰</button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (<span class="cart-count">0</span>)</a></li>
                </ul>
            </nav>
        </header>
        <section class="checkout-page">
            <h1>Checkout</h1>
            <div class="checkout-container">
                <form id="checkout-form" class="checkout-form">
                    <h3>Delivery Details</h3>
                    <div class="form-group">
                        <label for="customer-name">Full Name</label>
                        <input type="text" id="customer-name">
                    </div>
                    <div class="form-group">
                        <label for="customer-email">Email</label>
                        <input type="email" id="customer-email">
                    </div>
                    <div class="form-group">
                        <label for="customer-phone">Phone Number</label>
                        <input type="tel" id="customer-phone">
                    </div>
                    <div class="form-group">
                        <label for="customer-address">Delivery Address</label>
                        <textarea id="customer-address" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" id="place-order-btn">Place Order</button>
                </form>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div class="order-items"></div>
                    <div class="cart-summary-row">
                        <span>Subtotal</span>
                        <span class="checkout-subtotal">$0.00</span>
                    </div>
                    <div class="cart-summary-row total">
                        <span>Total</span>
                        <span class="checkout-total">$0.00</span>
                    </div>
                </div>
            </div>
        </section>
        <footer class="site-footer">
            <div class="footer-grid">
                <div>
                    <h4>ShopSpace</h4>
                    <p>Simple, quality clothing and lifestyle essentials.</p>
                </div>
                <div>
                    <h4>Shop</h4>
                    <a href="shop.html">All Products</a>
                    <a href="shop.html">Clothing</a>
                    <a href="shop.html">Footwear</a>
                    <a href="shop.html">Accessories</a>
                </div>
                <div>
                    <h4>Help</h4>
                    <a href="#">Shipping</a>
                    <a href="#">Returns</a>
                    <a href="#">Contact</a>
                </div>
            </div>
            <p class="footer-bottom">© 2026 ShopSpace. All rights reserved.</p>
        </footer>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
