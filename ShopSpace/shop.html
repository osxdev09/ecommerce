<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - ShopSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <header class="site-header">
            <nav class="navbar">
                <a href="index.html" class="logo">ShopSpace</a>
                <button class="nav-toggle">☰</button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (<span class="cart-count">0</span>)</a></li>
                </ul>
            </nav>
        </header>
        <section class="shop-header">
            <h1>Shop All Products</h1>
            <div class="shop-controls">
                <input type="text" id="search-input" placeholder="Search products...">
                <select id="sort-select">
                    <option value="default">Sort by</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="clothing">Clothing</button>
                <button class="filter-btn" data-category="footwear">Footwear</button>
                <button class="filter-btn" data-category="accessories">Accessories</button>
            </div>
        </section>

        <section class="shop-grid-section">
            <div class="product-grid shop-grid"></div>
        </section>
        <footer class="site-footer">
            <div class="footer-grid">
                <div>
                    <h4>ShopSpace</h4>
                    <p>Simple, quality clothing and lifestyle essentials.</p>
                </div>
                <div>
                    <h4>Shop</h4>
                    <a href="shop.html">All Products</a>
                    <a href="shop.html">Clothing</a>
                    <a href="shop.html">Footwear</a>
                    <a href="shop.html">Accessories</a>
                </div>
                <div>
                    <h4>Help</h4>
                    <a href="#">Shipping</a>
                    <a href="#">Returns</a>
                    <a href="#">Contact</a>
                </div>
            </div>
            <p class="footer-bottom">© 2026 ShopSpace. All rights reserved.</p>
        </footer>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
